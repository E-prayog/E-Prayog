<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="E-Prayog — An interactive virtual science laboratory for Karnataka PUC students featuring immersive 2D simulations and AI-powered tutoring." />
  <meta name="theme-color" content="#070A0F" />
  <title>E-Prayog | ಇ-ಪ್ರಯೋಗ — Virtual Science Lab for Karnataka PUC</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    /* ══════════════════════════════════════════
       E-Prayog — Obsidian Lab Design System v3.0
       Palette: Deep Obsidian + Lab Cyan + Tactical Amber
       "Precision instrumentation meets luxury interface."
       ══════════════════════════════════════════ */

    /* ── Google Fonts: Sora + Plus Jakarta Sans ── */
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

    /* ── Design Tokens ── */
    /* ── Design Tokens: Restrained Color System ── */
    :root {
      /* Backgrounds */
      --bg-primary:      #0B1120;
      --bg-surface:      #131B2E;
      --bg-canvas:       #0B1120;
      --bg-card:         #131B2E;
      --bg-base:         #0B1120;

      /* Text */
      --text-primary:    #F1F5F9;
      --text-secondary:  #94A3B8;
      --text-tertiary:   #64748B;
      --text-muted:      #64748B;
      --text-color:      #F1F5F9;

      /* Accent — Single Sky Blue Family (Used Flat) */
      --accent:          #38BDF8;
      --accent-hover:    #0EA5E9;
      --accent-soft:     rgba(56, 189, 248, 0.20);
      --accent-primary:  #38BDF8;
      --accent-bright:   #38BDF8;
      --accent-muted:    #0EA5E9;

      /* Borders / Dividers */
      --border:          #1E293B;
      --border-subtle:   #1E293B;
      --border-default:  #1E293B;

      /* Typography */
      --font-display:    'Sora', system-ui, sans-serif;
      --font-body:       'Plus Jakarta Sans', system-ui, sans-serif;
      --font-mono:       'JetBrains Mono', monospace;

      /* Border radius */
      --radius-sm:    4px;
      --radius-md:    8px;
      --radius-lg:   16px;
      --radius-xl:   24px;
      --radius-2xl:  32px;
      --radius-full: 999px;

      /* Easing tokens */
      --ease-out-expo:  cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out:    cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dark {
      --bg-base:      #0B1120;
      --text-color:   #F1F5F9;
      --glass-bg:     #131B2E;
      --glass-border: #1E293B;
      --nav-bg:       #0B1120;
    }

    /* ── Reset ── */
    * {
      box-sizing: border-box;
    }

    ::selection {
      background-color: rgba(56, 189, 248, 0.20);
      color: #F1F5F9;
    }

    /* ── Body: Deep Slate Canvas ── */
    body {
      background: #0B1120 !important;
      color: var(--text-primary);
      font-family: var(--font-body);
      position: relative;
      overflow-x: hidden;
      min-height: 100vh;
    }

    #root,
    #root > div {
      background-color: transparent !important;
      background-image: none !important;
    }

    /* Make sure app content sits above the background layers */
    #root > * {
      position: relative;
      z-index: 1;
    }

    /* ═══════════════════════════════════════════
       FLAT COMPONENTS — Restrained System
       ═══════════════════════════════════════════ */

    /* Base surface panel — used on cards, sections */
    .glass-panel {
      background: #131B2E;
      border: 1px solid #1E293B;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .glass-panel:hover {
      border-color: rgba(56, 189, 248, 0.25);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    /* Navbar glass — flat, lifted surface */
    .glass-nav {
      background: rgba(11, 17, 32, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #1E293B;
    }

    /* ── No text glow / drop-shadows ── */
    .text-glow, .text-gold-glow {
      text-shadow: none !important;
    }

    /* ── Buttons — Restrained Flat System ── */

    /* Primary CTA: Solid Sky Blue, dark text */
    .btn-primary {
      background: #38BDF8;
      color: #0B1120 !important;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      height: 48px;
      padding: 0 26px;
      border-radius: var(--radius-lg);
      border: none;
      cursor: pointer;
      letter-spacing: 0.01em;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      position: relative;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.30);
      transition: background-color 0.2s ease, transform 0.2s ease;
    }
    .btn-primary:hover {
      background: #0EA5E9;
      color: #0B1120 !important;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }
    .btn-primary:active {
      transform: translateY(0);
      box-shadow: none;
    }

    /* Secondary CTA: Hairline Border, fills to surface on hover */
    .btn-secondary {
      background: transparent;
      color: #F1F5F9;
      border: 1px solid #1E293B;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 500;
      height: 48px;
      padding: 0 26px;
      border-radius: var(--radius-lg);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.2s ease;
    }
    .btn-secondary:hover {
      border-color: #38BDF8;
      background: #131B2E;
      transform: translateY(-1px);
    }

    /* ── Hero pill badge — Flat Surface ── */
    .hero-badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #131B2E;
      border: 1px solid #1E293B;
      color: #94A3B8;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 16px;
      border-radius: var(--radius-full);
      margin-bottom: 24px;
      box-shadow: none !important;
    }

    /* ── Section overline label ── */
    .overline {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #38BDF8;
      display: block;
      margin-bottom: 12px;
    }

    /* ── Subject cards ── */
    .subject-card {
      background: rgba(18, 24, 36, 0.60);
      border: 1px solid rgba(226, 232, 240, 0.06);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s var(--ease-out-expo),
                  transform    0.3s var(--ease-out-expo),
                  box-shadow   0.3s var(--ease-out-expo);
      text-decoration: none;
      display: block;
    }
    .subject-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.30);
    }
    /* Subject top accent bars */
    .subject-card[data-subject] { border-top: 2px solid #38BDF8; }

    /* ── Stat cards (inline divider-separated) ── */
    .stat-item {
      padding: 0 40px;
      border-right: 1px solid rgba(226, 232, 240, 0.08);
      text-align: center;
    }
    .stat-item:last-child { border-right: none; }
    .stat-number {
      font-family: var(--font-display);
      font-size: 40px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.1;
    }
    .stat-label {
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: #0B1120;
    }

    ::-webkit-scrollbar-thumb {
      background: #1E293B;
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #38BDF8;
    }

    /* ══════════════════════════════════════════════════
         E-Prayog Navbar Orbital Logo Animations
         ══════════════════════════════════════════════════ */

    /* Outer ring — clockwise 6s */
    @keyframes ep-outer-rotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Inner ring — counter-clockwise 4s */
    @keyframes ep-inner-rotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }

    /* E glow pulse */
    @keyframes ep-glow-pulse {
      0%, 100% { opacity: 0.40; }
      50%       { opacity: 0.75; }
    }

    /* E letter breathe */
    @keyframes ep-e-breathe {
      0%, 100% { transform: scale(1.0); }
      50%       { transform: scale(1.03); }
    }

    /* Spark shimmer */
    @keyframes ep-spark {
      0%, 100% { opacity: 0.10; }
      50%       { opacity: 0.50; }
    }

    .ep-outer-ring {
      animation: ep-outer-rotate 8s linear infinite;
      will-change: transform;
      transform-origin: 40px 40px;
    }

    .ep-inner-ring {
      animation: ep-inner-rotate 5s linear infinite;
      will-change: transform;
      transform-origin: 40px 40px;
    }

    .ep-eglow {
      animation: ep-glow-pulse 5s ease-in-out infinite;
      will-change: opacity;
    }

    .ep-eletter {
      animation: ep-e-breathe 5s ease-in-out infinite;
      transform-origin: 40px 40px;
    }

    .ep-spark {
      animation: ep-spark ease-in-out infinite;
    }

    .ep-s1 { animation-duration: 3.5s; animation-delay: 0s; }
    .ep-s2 { animation-duration: 4.8s; animation-delay: 0.8s; }
    .ep-s3 { animation-duration: 3.2s; animation-delay: 1.6s; }
    .ep-s4 { animation-duration: 4.2s; animation-delay: 0.4s; }

    /* Hover: accelerate rings */
    .ep-logo-link:hover .ep-outer-ring { animation-duration: 2.5s; }
    .ep-logo-link:hover .ep-inner-ring { animation-duration: 1.5s; }

    /* ═══════════════════════════════════════════
       GLOBAL TYPOGRAPHY OVERRIDES — Obsidian Lab
       ═══════════════════════════════════════════ */

    /* Force Sora for all display/heading elements */
    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-display) !important;
      color: var(--text-primary);
    }

    /* Body text — Plus Jakarta Sans */
    p, span, li, a, button, input, textarea, label {
      font-family: var(--font-body);
    }

    /* Code elements */
    code, pre, kbd, samp {
      font-family: var(--font-mono) !important;
    }

    /* Link defaults */
    a {
      color: var(--accent-primary);
      transition: color 0.2s var(--ease-out-expo);
    }
    a:hover { color: #E2E8F0; }

    /* Tailwind text color overrides to match Obsidian palette */
    .text-white    { color: var(--text-primary)   !important; }
    .text-zinc-400 { color: var(--text-secondary) !important; }
    .text-zinc-500 { color: var(--text-muted)     !important; }

    /* Emerald accent → Lab Cyan */
    .text-emerald-400,
    .text-emerald-300 {
      color: var(--accent-primary) !important;
    }
    .text-emerald-600 { color: var(--accent-muted) !important; }

    /* Bg emerald → accent */
    .bg-emerald-600,
    .bg-emerald-500 {
      background: #38BDF8 !important;
      color: #0B1120 !important;
    }
    .hover\:bg-emerald-500:hover,
    .hover\:bg-emerald-600:hover {
      background: #0EA5E9 !important;
    }

    /* Remove coloured glow shadows — plain elevation only */
    .shadow-emerald-600\/25,
    .hover\:shadow-emerald-500\/30:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.30) !important;
    }

    /* Card backgrounds */
    .bg-zinc-900, .bg-zinc-800 {
      background-color: var(--bg-card) !important;
    }

    /* Purple accent → accent */
    .text-purple-400 { color: var(--accent) !important; }
    .from-violet-600  { --tw-gradient-from: #38BDF8 !important; }
    .to-sky-500       { --tw-gradient-to:   #0EA5E9 !important; }
    .bg-gradient-to-r.from-violet-600.to-sky-500 {
      background: #38BDF8 !important;
    }

    /* Active nav indicator */
    .bg-emerald-400 {
      background-color: #38BDF8 !important;
    }

    /* Hero gradient overlay: disable, handled by body layers */
    .from-emerald-500\/\[0\.07\],
    .to-blue-500\/\[0\.07\] {
      opacity: 0 !important;
    }

    /* ── Responsive typography scale ── */
    @media (max-width: 640px) {
      h1 { font-size: clamp(28px, 8vw, 46px) !important; }
      h2 { font-size: clamp(22px, 6vw, 34px) !important; }
      .stat-number { font-size: 28px !important; }
      .stat-item   { padding: 0 16px !important; }
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
